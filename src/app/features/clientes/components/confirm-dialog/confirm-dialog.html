<h2 mat-dialog-title>
  Excluir cliente?
</h2>

<mat-dialog-content>

  <p>
    Tem certeza que deseja excluir
    <strong>{{ data.nome }}</strong>?
  </p>

  <p class="aviso">
    Essa ação não poderá ser desfeita.
  </p>

</mat-dialog-content>


<mat-dialog-actions align="end">

  <button
    mat-button
    type="button"
    (click)="cancelar()">

    Cancelar

  </button>


  <button
    mat-flat-button
    type="button"
    (click)="confirmar()">

    Excluir

  </button>

</mat-dialog-actions>
